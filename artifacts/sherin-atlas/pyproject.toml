[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sherin-atlas"
version = "0.1.0"
description = "Sherin Atlas — Deterministic Reasoning Engine (Cognitor + Domain Adapters)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Sherin Atlas Contributors" }
]
keywords = [
    "reasoning-engine",
    "deterministic-ai",
    "symbolic-reasoning",
    "verification",
    "program-synthesis",
    "cognitor"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.0",
    "typing-extensions>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.6",
]

[project.urls]
Homepage = "https://github.com/your-org/sherin-atlas"
Documentation = "https://github.com/your-org/sherin-atlas/tree/main/docs"
Repository = "https://github.com/your-org/sherin-atlas"

[tool.setuptools.packages.find]
where = ["."]
include = ["sherin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
